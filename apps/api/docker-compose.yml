# Local PostgreSQL for development (database "checkit") and tests (database "checkit_test")
name: checkit

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: checkit
      POSTGRES_PASSWORD: checkit
      POSTGRES_DB: checkit
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkit -d checkit"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
